<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Composição Analítica de Custos</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --blue:#3b5bdb; --blue2:#4c6ef5; --indigo:#4263eb; --purple:#7048e8; --purple2:#9775fa;
  --bg:#0f1021; --bg2:#171a35; --panel:#1d2142; --panel2:#242a52;
  --line:#333a63; --txt:#eef0ff; --mut:#a9b0e0;
  --green:#2fb380; --greenbg:#143a2c; --red:#e85b78; --redbg:#3a1826; --yellow:#e0b64b; --yellowbg:#3a331a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:linear-gradient(135deg,#0f1021,#191b3a 55%,#241a44);color:var(--txt);min-height:100vh}
.app{display:flex;min-height:100vh}
/* SIDEBAR */
.sidebar{width:260px;background:linear-gradient(180deg,#1a1d3d,#241a44);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand .ico{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--blue2),var(--purple));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 18px rgba(112,72,232,.45)}
.brand h1{font-size:15px;line-height:1.2;font-weight:700;letter-spacing:.3px}
.brand small{color:var(--mut);font-size:11px}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.nav button{display:flex;align-items:center;gap:12px;background:transparent;border:none;color:var(--mut);padding:12px 14px;border-radius:10px;cursor:pointer;font-size:14px;text-align:left;transition:.18s;width:100%}
.nav button .e{font-size:17px}
.nav button:hover{background:rgba(118,117,250,.12);color:#fff}
.nav button.active{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;box-shadow:0 6px 16px rgba(66,99,235,.4)}
.side-foot{margin-top:auto;font-size:11px;color:var(--mut);padding:12px 8px;border-top:1px solid var(--line)}
/* MAIN */
.main{flex:1;padding:26px 30px;overflow-x:hidden}
.page-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px}
.page-head h2{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
.page-head p{color:var(--mut);font-size:13px;margin-top:3px}
select,input{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:9px;font-size:13px;outline:none}
select:focus,input:focus{border-color:var(--purple2)}
.btn{background:linear-gradient(135deg,var(--blue2),var(--purple));color:#fff;border:none;padding:10px 16px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line)}
.btn.danger{background:var(--redbg);border:1px solid var(--red);color:#ffb3c2;padding:6px 10px;font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:24px}
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative;overflow:hidden}
.card::after{content:'';position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(118,117,250,.25),transparent 70%)}
.card .lab{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.card .val{font-size:24px;font-weight:700;margin-top:8px}
.card .sub{font-size:12px;color:var(--mut);margin-top:6px}
.panel{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:22px}
.panel h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .sp{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:var(--panel)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:rgba(118,117,250,.06)}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.t-eco{background:var(--greenbg);color:#7dffc4;border:1px solid var(--green)}
.t-up{background:var(--redbg);color:#ffb3c2;border:1px solid var(--red)}
.t-eq{background:var(--yellowbg);color:#ffe39a;border:1px solid var(--yellow)}
.pos{color:#ff9db0}.neg{color:#7dffc4}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.chart-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:300px;position:relative}
.chart-box h4{font-size:13px;color:var(--mut);margin-bottom:10px;font-weight:600}
.chart-box canvas{max-height:260px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;margin-bottom:22px}
.vs .mb{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center}
.vs .mb.a{border-color:var(--blue2)}
.vs .mb.b{border-color:var(--purple2)}
.vs .mb .mname{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.vs .mb .mtot{font-size:30px;font-weight:800;margin-top:8px}
.vs .mb .mcount{font-size:12px;color:var(--mut);margin-top:6px}
.vs .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:150px}
.vs .mid .arrow{font-size:30px}
.vs .mid .delta{font-size:20px;font-weight:800}
.vs .mid .pct{font-size:13px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-size:14px}
.hint{font-size:12px;color:var(--mut)}
.row-actions{display:flex;gap:6px}
.add-row{display:grid;grid-template-columns:2fr 1.6fr 1fr auto;gap:10px;margin-top:14px;align-items:end}
.add-row label{font-size:11px;color:var(--mut);display:block;margin-bottom:5px}
.add-row input,.add-row select{width:100%}
.backup{display:flex;flex-direction:column;gap:8px;padding:14px 2px 6px;border-top:1px solid var(--line);margin-top:10px}
.backup .btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px}
.backup .bt{font-size:10px;color:var(--mut);padding:0 4px;line-height:1.4}
.cat-add{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-bottom:16px}
.cat-add label{font-size:11px;color:var(--mut);display:block;margin-bottom:5px}
.cat-add input{width:100%}
@media(max-width:900px){.backup .bt,.backup .btn .lbl{display:none}.cat-add{grid-template-columns:1fr}}
@media(max-width:900px){.chart-grid{grid-template-columns:1fr}.vs{grid-template-columns:1fr}.sidebar{width:72px}.brand h1,.brand small,.nav button span.lbl,.side-foot{display:none}.nav button{justify-content:center}}
@media print{.sidebar,.toolbar,.no-print{display:none!important}.main{padding:0}body{background:#fff;color:#000}.panel,.card,.chart-box,.vs .mb{background:#fff;border-color:#ccc}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">
    <div class="ico">💰</div>
    <div><h1>COMPOSIÇÃO ANALÍTICA DE CUSTOS</h1><small>Controle & Comparação 2026</small></div>
  </div>
  <nav class="nav" id="nav">
    <button data-v="resumo" class="active"><span class="e">📊</span><span class="lbl">Resumo</span></button>
    <button data-v="lancamentos"><span class="e">🧾</span><span class="lbl">Lançamentos</span></button>
    <button data-v="dashboard"><span class="e">📈</span><span class="lbl">Dashboard</span></button>
    <button data-v="resultado"><span class="e">🔀</span><span class="lbl">Resultado</span></button>
    <button data-v="categorias"><span class="e">🏷️</span><span class="lbl">Categorias</span></button>
  </nav>
  <div class="backup no-print">
    <button class="btn" id="btnExportar" title="Exportar Backup"><span>⬇️</span><span class="lbl">Exportar Backup</span></button>
    <button class="btn ghost" id="btnImportar" title="Importar Backup"><span>⬆️</span><span class="lbl">Importar Backup</span></button>
    <input type="file" id="fileImportar" accept=".json,.txt,application/json,text/plain" style="display:none">
    <div class="bt">Baixa/carrega todos os dados em um arquivo .json no seu computador.</div>
  </div>
  <div class="side-foot">R$ • pt-BR • dados salvos no navegador</div>
</aside>
<main class="main" id="main">
  <section id="view-resumo" class="view"></section>
  <section id="view-lancamentos" class="view" style="display:none"></section>
  <section id="view-dashboard" class="view" style="display:none"></section>
  <section id="view-resultado" class="view" style="display:none"></section>
  <section id="view-categorias" class="view" style="display:none"></section>
</main>
</div>
<script>
'use strict';
const MESES=['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
const MLABEL={JANEIRO:'Janeiro',FEVEREIRO:'Fevereiro','MARÇO':'Março',ABRIL:'Abril',MAIO:'Maio',JUNHO:'Junho',JULHO:'Julho',AGOSTO:'Agosto',SETEMBRO:'Setembro',OUTUBRO:'Outubro',NOVEMBRO:'Novembro',DEZEMBRO:'Dezembro'};
const SEED={"JANEIRO": [], "FEVEREIRO": [], "MARÇO": [], "ABRIL": [], "MAIO": [], "JUNHO": [], "JULHO": [], "AGOSTO": [{"fornecedor": "Posto Federal", "categoria": "Combustível", "valor": 55181.66}, {"fornecedor": "Erik Bernardo", "categoria": "Manutenção Frota", "valor": 2250.0}, {"fornecedor": "Patrimonial Pneus", "categoria": "Manutenção Frota", "valor": 1026.67}, {"fornecedor": "Patrícia Almeida Hoteis", "categoria": "Estadia", "valor": 400.0}, {"fornecedor": "Minova", "categoria": "Manutenção Equipamento", "valor": 9550.0}, {"fornecedor": "Pernambuco Fossas", "categoria": "Custo Operacional", "valor": 3750.0}, {"fornecedor": "San Distribuidora", "categoria": "Custo Operacional", "valor": 255.0}, {"fornecedor": "Compesa", "categoria": "Água", "valor": 181.76}, {"fornecedor": "Mazzarops", "categoria": "Manutenção Frota", "valor": 140.0}, {"fornecedor": "Florisdaura", "categoria": "Copa/Escritório", "valor": 129.5}, {"fornecedor": "AS Hidráulica", "categoria": "Manutenção Frota", "valor": 3000.0}, {"fornecedor": "Equipar", "categoria": "Manutenção Geral", "valor": 1665.0}, {"fornecedor": "Renascer Mercantil", "categoria": "EPI", "valor": 973.29}, {"fornecedor": "Rediesel", "categoria": "Manutenção Geral", "valor": 587.0}, {"fornecedor": "Auto Diesel", "categoria": "Manutenção Geral", "valor": 1451.43}, {"fornecedor": "Tanará", "categoria": "Aditivo e Lubrificante", "valor": 361.9}, {"fornecedor": "Esperança Nordeste", "categoria": "Manutenção Geral", "valor": 1019.76}, {"fornecedor": "Mafema", "categoria": "Manutenção Equipamento", "valor": 470.1}, {"fornecedor": "Rediesel", "categoria": "Manutenção Frota", "valor": 583.0}, {"fornecedor": "Rediesel", "categoria": "Aditivo e Lubrificante", "valor": 165.0}, {"fornecedor": "Neoenergia", "categoria": "Energia", "valor": 911.08}, {"fornecedor": "LF Borracharia", "categoria": "Manutenção Frota", "valor": 1055.0}], "SETEMBRO": [{"fornecedor": "Compacta Hidráulica", "categoria": "Manutenção Equipamento", "valor": 3840.0}, {"fornecedor": "Posto Federal", "categoria": "Combustível", "valor": 45320.23}, {"fornecedor": "Renascer Mercantil", "categoria": "EPI", "valor": 973.28}, {"fornecedor": "LF Borracharia", "categoria": "Manutenção Frota", "valor": 1515.0}, {"fornecedor": "Auto Diesel", "categoria": "Manutenção Frota", "valor": 98.0}, {"fornecedor": "AS Hidráulica", "categoria": "Manutenção Equipamento", "valor": 10750.0}, {"fornecedor": "Patrícia Almeida Hoteis", "categoria": "Estadia", "valor": 400.0}, {"fornecedor": "Pernambuco Fossa", "categoria": "Custo Operacional", "valor": 2250.0}, {"fornecedor": "Armazém Cecília", "categoria": "Manutenção Predial", "valor": 32.9}, {"fornecedor": "Eletroflash", "categoria": "Manutenção Equipamento", "valor": 825.0}, {"fornecedor": "Rafael Mangueiras", "categoria": "Manutenção Frota", "valor": 3834.0}, {"fornecedor": "Rafael Mangueiras", "categoria": "Aditivo e Lubrificante", "valor": 30.0}, {"fornecedor": "Rafael Mangueiras", "categoria": "Manutenção Equipamento", "valor": 4904.0}, {"fornecedor": "Auto Norte", "categoria": "Aditivo e Lubrificante", "valor": 1376.0}, {"fornecedor": "Auto Norte", "categoria": "Manutenção Frota", "valor": 1079.2}, {"fornecedor": "Rediesel", "categoria": "Manutenção Frota", "valor": 6445.1}, {"fornecedor": "Auto Diesel", "categoria": "Aditivo e Lubrificante", "valor": 448.0}, {"fornecedor": "Auto Diesel", "categoria": "Manutenção Frota", "valor": 946.0}, {"fornecedor": "Novo Nordeste", "categoria": "Manutenção Equipamento", "valor": 306.83}, {"fornecedor": "Patrimonial Pneus", "categoria": "Manutenção Frota", "valor": 2666.67}, {"fornecedor": "Tanará", "categoria": "Aditivo e Lubrificante", "valor": 798.0}, {"fornecedor": "Compesa", "categoria": "Água", "valor": 92.69}, {"fornecedor": "Mazzarops", "categoria": "Manutenção Frota", "valor": 393.0}, {"fornecedor": "Du Major", "categoria": "Manutenção Equipamento", "valor": 241.6}, {"fornecedor": "E. Paulo Ferreira", "categoria": "Manutenção Frota", "valor": 50.0}, {"fornecedor": "Minova", "categoria": "Manutenção Equipamento", "valor": 7100.0}, {"fornecedor": "San Distribuidora", "categoria": "Custo Operacional", "valor": 258.0}, {"fornecedor": "Compacta Ambiental", "categoria": "Manutenção Equipamento", "valor": 480.0}, {"fornecedor": "Armazém carlos", "categoria": "Manutenção Predial", "valor": 1755.0}, {"fornecedor": "Astep", "categoria": "Manutenção Frota", "valor": 855.0}, {"fornecedor": "Grimaldi", "categoria": "Manutenção Equipamento", "valor": 2077.65}, {"fornecedor": "Reccoat", "categoria": "Manutenção Equipamento", "valor": 1160.0}, {"fornecedor": "Jose J Rodrigues", "categoria": "Manutenção Frota", "valor": 1512.4}, {"fornecedor": "Samuel Calumbi Correia", "categoria": "Manutenção Equipamento", "valor": 120.0}, {"fornecedor": "Neoenergia", "categoria": "Energia", "valor": 1108.74}], "OUTUBRO": [], "NOVEMBRO": [], "DEZEMBRO": []};
const KEY='composicao_custos_2026';
let DB;
try{DB=JSON.parse(localStorage.getItem(KEY))||null;}catch(e){DB=null;}
if(!DB){DB=JSON.parse(JSON.stringify(SEED));save();}
for(const m of MESES){if(!DB[m])DB[m]=[];}
function save(){localStorage.setItem(KEY,JSON.stringify(DB));}

// ---------- CATEGORIAS (cadastro) ----------
const CATKEY='composicao_custos_2026_categorias';
const CATS_PADRAO=['Combustível','Manutenção Frota','Manutenção Equipamento','Manutenção Predial','Manutenção Geral','Aditivo e Lubrificante','Custo Operacional','Energia','Água','Estadia','EPI','Copa/Escritório'];
let CATS;
try{CATS=JSON.parse(localStorage.getItem(CATKEY));}catch(e){CATS=null;}
if(!Array.isArray(CATS))CATS=CATS_PADRAO.slice();
function saveCats(){localStorage.setItem(CATKEY,JSON.stringify(CATS));}
function catExists(n){const k=String(n).trim().toLowerCase();return CATS.some(c=>String(c).trim().toLowerCase()===k);}
function sortCats(){CATS.sort((a,b)=>String(a).localeCompare(String(b),'pt-BR'));}
function syncCatsFromDB(){
  MESES.forEach(m=>DB[m].forEach(r=>{const c=String(r.categoria||'').trim();if(c&&!catExists(c))CATS.push(c);}));
  sortCats();saveCats();
}
syncCatsFromDB();
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

// paleta azul/roxo p/ gráficos
const PAL=['#4c6ef5','#7048e8','#3b5bdb','#9775fa','#5c7cfa','#845ef7','#4263eb','#b197fc','#364fc7','#6741d9','#748ffc','#9c36b5'];
const GRID='rgba(118,117,250,.12)', TICK='#a9b0e0';
Chart.defaults.color=TICK;Chart.defaults.font.family="'Segoe UI',system-ui,Arial";

const brl=v=>'R$ '+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pctf=v=>(v>=0?'+':'')+(v*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const UP=s=>s.toUpperCase();
const mesTotal=m=>DB[m].reduce((s,r)=>s+(+r.valor||0),0);
const mesesComDados=()=>MESES.filter(m=>DB[m].length>0);
function aggBy(m,field){const o={};DB[m].forEach(r=>{const k=r[field]||'(sem)';o[k]=(o[k]||0)+(+r.valor||0);});return o;}
function situ(delta){if(delta<0)return['ECONOMIA','t-eco'];if(delta>0)return['AUMENTO DE CUSTO','t-up'];return['SEM VARIAÇÃO','t-eq'];}

let charts={};
function mkChart(id,cfg){if(charts[id]){charts[id].destroy();}const el=document.getElementById(id);if(el)charts[id]=new Chart(el,cfg);}

// ---------- NAV ----------
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const v=b.dataset.v;document.querySelectorAll('.view').forEach(s=>s.style.display='none');document.getElementById('view-'+v).style.display='block';render(v);});
function render(v){if(v==='resumo')renderResumo();else if(v==='lancamentos')renderLanc();else if(v==='dashboard')renderDash();else if(v==='resultado')renderResult();else if(v==='categorias')renderCats();}

// ---------- RESUMO ----------
function renderResumo(){
  const comDados=mesesComDados();
  const totais=comDados.map(m=>({m,t:mesTotal(m)}));
  const totalAno=totais.reduce((s,x)=>s+x.t,0);
  const media=totais.length?totalAno/totais.length:0;
  let maior={m:'-',t:0},menor=null;
  totais.forEach(x=>{if(x.t>maior.t)maior=x;if(menor===null||x.t<menor.t)menor=x;});
  if(!menor)menor={m:'-',t:0};
  const el=document.getElementById('view-resumo');
  el.innerHTML=`
  <div class="page-head"><div><h2>📊 Resumo Geral</h2><p>Visão consolidada dos custos lançados em 2026</p></div></div>
  <div class="cards">
    <div class="card"><div class="lab">Custo total do ano</div><div class="val">${brl(totalAno)}</div><div class="sub">${comDados.length} mês(es) com lançamentos</div></div>
    <div class="card"><div class="lab">Média mensal</div><div class="val">${brl(media)}</div><div class="sub">considerando meses com dados</div></div>
    <div class="card"><div class="lab">Mês de maior custo</div><div class="val">${MLABEL[maior.m]||'-'}</div><div class="sub">${brl(maior.t)}</div></div>
    <div class="card"><div class="lab">Mês de menor custo</div><div class="val">${MLABEL[menor.m]||'-'}</div><div class="sub">${brl(menor.t)}</div></div>
  </div>
  <div class="panel"><h3>📈 Custo total por mês</h3><div class="chart-box" style="min-height:320px"><canvas id="c_resumo"></canvas></div></div>
  <div class="panel"><h3>🧾 Totais por mês</h3>
    <table><thead><tr><th>Mês</th><th>Lançamentos</th><th class="num">Custo Total</th><th class="num">% do ano</th></tr></thead><tbody>
    ${MESES.map(m=>{const t=mesTotal(m);const n=DB[m].length;if(n===0)return '';return `<tr><td>${MLABEL[m]}</td><td>${n}</td><td class="num">${brl(t)}</td><td class="num">${totalAno?((t/totalAno)*100).toFixed(1):'0'}%</td></tr>`;}).join('')||'<tr><td colspan="4" class="empty">Nenhum lançamento ainda.</td></tr>'}
    </tbody></table>
  </div>`;
  const lb=MESES.filter(m=>mesTotal(m)>0);
  mkChart('c_resumo',{type:'bar',data:{labels:lb.map(m=>MLABEL[m]),datasets:[{label:'Custo (R$)',data:lb.map(m=>mesTotal(m)),backgroundColor:lb.map((_,i)=>PAL[i%PAL.length]),borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>brl(c.parsed.y)}}},scales:{y:{grid:{color:GRID},ticks:{callback:v=>'R$ '+v.toLocaleString('pt-BR')}},x:{grid:{display:false}}}}});
}

// ---------- LANÇAMENTOS ----------
let lancMes='SETEMBRO';
function renderLanc(){
  const el=document.getElementById('view-lancamentos');
  const cats=CATS;
  el.innerHTML=`
  <div class="page-head"><div><h2>🧾 Lançamentos por mês</h2><p>Fornecedor, categoria e valor — recalcula o total automaticamente</p></div>
    <div class="no-print"><button class="btn ghost" onclick="window.print()">🖨️ Imprimir mês</button></div></div>
  <div class="panel">
    <div class="toolbar">
      <label class="hint">Mês:</label>
      <select id="lancSel">${MESES.map(m=>`<option value="${m}" ${m===lancMes?'selected':''}>${MLABEL[m]}${DB[m].length?' • '+DB[m].length:''}</option>`).join('')}</select>
      <span class="sp"></span>
      <span class="hint">Total do mês:</span><strong id="lancTot" style="font-size:16px"></strong>
    </div>
    <table><thead><tr><th>Fornecedor</th><th>Categoria</th><th class="num">Valor (R$)</th><th class="no-print">Ações</th></tr></thead>
      <tbody id="lancBody"></tbody></table>
    <div class="add-row no-print">
      <div><label>Fornecedor</label><input id="nf" placeholder="NOME DO FORNECEDOR"></div>
      <div><label>Categoria</label><input id="nc" list="catlist" placeholder="CATEGORIA"><datalist id="catlist">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
      <div><label>Valor (R$)</label><input id="nv" type="number" step="0.01" placeholder="0,00"></div>
      <div><button class="btn" id="addBtn">+ Adicionar</button></div>
    </div>
  </div>`;
  document.getElementById('lancSel').onchange=e=>{lancMes=e.target.value;drawLanc();};
  document.getElementById('addBtn').onclick=addLanc;
  ['nf','nc'].forEach(id=>document.getElementById(id).addEventListener('input',e=>{e.target.value=UP(e.target.value);}));
  drawLanc();
}
function drawLanc(){
  const tb=document.getElementById('lancBody');
  const rows=DB[lancMes];
  tb.innerHTML=rows.length?rows.map((r,i)=>`<tr>
    <td>${r.fornecedor||''}</td><td>${r.categoria||''}</td><td class="num">${brl(r.valor)}</td>
    <td class="no-print row-actions"><button class="btn danger" onclick="delLanc(${i})">Excluir</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">Sem lançamentos neste mês. Adicione abaixo.</td></tr>';
  document.getElementById('lancTot').textContent=brl(mesTotal(lancMes));
}
function addLanc(){
  const f=UP(document.getElementById('nf').value.trim());
  const c=UP(document.getElementById('nc').value.trim());
  const v=parseFloat(document.getElementById('nv').value);
  if(!f||isNaN(v)){alert('Informe ao menos o Fornecedor e o Valor.');return;}
  if(c&&!catExists(c)){CATS.push(c);sortCats();saveCats();const dl=document.getElementById('catlist');if(dl)dl.innerHTML=CATS.map(x=>`<option value="${esc(x)}">`).join('');}
  DB[lancMes].push({fornecedor:f,categoria:c,valor:Math.round(v*100)/100});save();
  document.getElementById('nf').value='';document.getElementById('nc').value='';document.getElementById('nv').value='';
  drawLanc();
}
function delLanc(i){if(confirm('Excluir este lançamento?')){DB[lancMes].splice(i,1);save();drawLanc();}}

// ---------- DASHBOARD ----------
let dashMes='TODOS';
function renderDash(){
  const el=document.getElementById('view-dashboard');
  el.innerHTML=`
  <div class="page-head"><div><h2>📈 Dashboard Analítico</h2><p>Custos por categoria e por fornecedor — filtre por período</p></div>
    <div class="no-print toolbar" style="margin:0">
      <label class="hint">Período:</label>
      <select id="dashSel"><option value="TODOS">Ano inteiro</option>${MESES.filter(m=>DB[m].length).map(m=>`<option value="${m}" ${m===dashMes?'selected':''}>${MLABEL[m]}</option>`).join('')}</select>
    </div></div>
  <div class="cards" id="dashCards"></div>
  <div class="chart-grid">
    <div class="chart-box"><h4>Custo por categoria</h4><canvas id="c_cat"></canvas></div>
    <div class="chart-box"><h4>Top fornecedores (maiores custos)</h4><canvas id="c_forn"></canvas></div>
  </div>
  <div class="chart-grid" style="margin-top:20px">
    <div class="panel" style="margin:0"><h3>🔝 Maiores custos por fornecedor — Top 10</h3><table><thead><tr><th>#</th><th>Fornecedor</th><th class="num">Total</th></tr></thead><tbody id="topBody"></tbody></table></div>
    <div class="panel" style="margin:0"><h3>🔻 Menores custos por fornecedor — Top 5</h3><table><thead><tr><th>#</th><th>Fornecedor</th><th class="num">Total</th></tr></thead><tbody id="botBody"></tbody></table></div>
  </div>`;
  document.getElementById('dashSel').onchange=e=>{dashMes=e.target.value;drawDash();};
  drawDash();
}
function dashData(field){
  const o={};const src=dashMes==='TODOS'?mesesComDados():[dashMes];
  src.forEach(m=>{DB[m].forEach(r=>{const k=r[field]||'(sem)';o[k]=(o[k]||0)+(+r.valor||0);});});
  return o;
}
function drawDash(){
  const src=dashMes==='TODOS'?mesesComDados():[dashMes];
  const total=src.reduce((s,m)=>s+mesTotal(m),0);
  const cat=dashData('categoria');const forn=dashData('fornecedor');
  const catArr=Object.entries(cat).sort((a,b)=>b[1]-a[1]);
  const fornArr=Object.entries(forn).sort((a,b)=>b[1]-a[1]);
  const nLanc=src.reduce((s,m)=>s+DB[m].length,0);
  document.getElementById('dashCards').innerHTML=`
    <div class="card"><div class="lab">Total do período</div><div class="val">${brl(total)}</div><div class="sub">${dashMes==='TODOS'?'ano inteiro':MLABEL[dashMes]}</div></div>
    <div class="card"><div class="lab">Lançamentos</div><div class="val">${nLanc}</div><div class="sub">${catArr.length} categorias • ${fornArr.length} fornecedores</div></div>
    <div class="card"><div class="lab">Maior categoria</div><div class="val">${catArr[0]?catArr[0][0]:'-'}</div><div class="sub">${catArr[0]?brl(catArr[0][1]):''}</div></div>
    <div class="card"><div class="lab">Maior fornecedor</div><div class="val">${fornArr[0]?fornArr[0][0]:'-'}</div><div class="sub">${fornArr[0]?brl(fornArr[0][1]):''}</div></div>`;
  mkChart('c_cat',{type:'doughnut',data:{labels:catArr.map(x=>x[0]),datasets:[{data:catArr.map(x=>x[1]),backgroundColor:catArr.map((_,i)=>PAL[i%PAL.length]),borderColor:'#1d2142',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:c=>c.label+': '+brl(c.parsed)}}}}});
  const topF=fornArr.slice(0,10);
  mkChart('c_forn',{type:'bar',data:{labels:topF.map(x=>x[0]),datasets:[{label:'Total',data:topF.map(x=>x[1]),backgroundColor:topF.map((_,i)=>PAL[i%PAL.length]),borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>brl(c.parsed.x)}}},scales:{x:{grid:{color:GRID},ticks:{callback:v=>'R$ '+v.toLocaleString('pt-BR')}},y:{grid:{display:false},ticks:{font:{size:11}}}}}});
  document.getElementById('topBody').innerHTML=fornArr.slice(0,10).map((x,i)=>`<tr><td>${i+1}</td><td>${x[0]}</td><td class="num">${brl(x[1])}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Sem dados.</td></tr>';
  document.getElementById('botBody').innerHTML=fornArr.slice().sort((a,b)=>a[1]-b[1]).slice(0,5).map((x,i)=>`<tr><td>${i+1}</td><td>${x[0]}</td><td class="num">${brl(x[1])}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Sem dados.</td></tr>';
}

// ---------- RESULTADO (comparação de 2 meses escolhidos) ----------
let resA='AGOSTO', resB='SETEMBRO';
function renderResult(){
  const el=document.getElementById('view-resultado');
  const opts=m=>MESES.map(x=>`<option value="${x}" ${x===m?'selected':''}>${MLABEL[x]}${DB[x].length?' • '+DB[x].length:' (vazio)'}</option>`).join('');
  el.innerHTML=`
  <div class="page-head"><div><h2>🔀 Resultado — Comparação de Custos</h2><p>Escolha dois meses para comparar lado a lado</p></div>
    <div class="no-print"><button class="btn ghost" onclick="window.print()">🖨️ Imprimir</button></div></div>
  <div class="panel no-print"><div class="toolbar" style="margin:0">
    <label class="hint">Mês A:</label><select id="selA">${opts(resA)}</select>
    <span style="font-weight:700;color:var(--purple2)">VS</span>
    <label class="hint">Mês B:</label><select id="selB">${opts(resB)}</select>
    <span class="sp"></span><button class="btn" id="swap">⇄ Inverter</button>
  </div></div>
  <div id="resOut"></div>`;
  document.getElementById('selA').onchange=e=>{resA=e.target.value;drawResult();};
  document.getElementById('selB').onchange=e=>{resB=e.target.value;drawResult();};
  document.getElementById('swap').onclick=()=>{[resA,resB]=[resB,resA];renderResult();};
  drawResult();
}
function drawResult(){
  const out=document.getElementById('resOut');
  const ta=mesTotal(resA),tb=mesTotal(resB);
  const delta=tb-ta;const pct=ta===0?(tb===0?0:1):delta/ta;
  const[sl,cls]=situ(delta);
  const arrow=delta<0?'🟢▼':delta>0?'🔴▲':'🟡=';
  // agregação por categoria
  const ca=aggBy(resA,'categoria'),cb=aggBy(resB,'categoria');
  const catKeys=[...new Set([...Object.keys(ca),...Object.keys(cb)])].sort((k1,k2)=>((cb[k2]||0)+(ca[k2]||0))-((cb[k1]||0)+(ca[k1]||0)));
  // agregação por fornecedor
  const fa=aggBy(resA,'fornecedor'),fb=aggBy(resB,'fornecedor');
  const fornKeys=[...new Set([...Object.keys(fa),...Object.keys(fb)])].sort((k1,k2)=>((fb[k2]||0)+(fa[k2]||0))-((fb[k1]||0)+(fa[k1]||0)));
  const rowCmp=(k,a,b)=>{const d=b-a;const p=a===0?(b===0?0:1):d/a;const[s,c]=situ(d);return `<tr><td>${k}</td><td class="num">${brl(a)}</td><td class="num">${brl(b)}</td><td class="num ${d>0?'pos':d<0?'neg':''}">${(d>=0?'+':'')+brl(d).replace('R$ ','R$ ')}</td><td class="num">${pctf(p)}</td><td><span class="tag ${c}">${s}</span></td></tr>`;};
  out.innerHTML=`
  <div class="vs">
    <div class="mb a"><div class="mname">${MLABEL[resA]}</div><div class="mtot">${brl(ta)}</div><div class="mcount">${DB[resA].length} lançamento(s)</div></div>
    <div class="mid"><div class="arrow">${arrow}</div><div class="delta ${delta>0?'pos':delta<0?'neg':''}">${(delta>=0?'+':'')+brl(delta)}</div><div class="pct">${pctf(pct)}</div><span class="tag ${cls}">${sl}</span></div>
    <div class="mb b"><div class="mname">${MLABEL[resB]}</div><div class="mtot">${brl(tb)}</div><div class="mcount">${DB[resB].length} lançamento(s)</div></div>
  </div>
  <div class="chart-grid">
    <div class="chart-box"><h4>Total: ${MLABEL[resA]} vs ${MLABEL[resB]}</h4><canvas id="c_cmpTot"></canvas></div>
    <div class="chart-box"><h4>Comparação por categoria</h4><canvas id="c_cmpCat"></canvas></div>
  </div>
  <div class="panel" style="margin-top:22px"><h3>📂 Variação por categoria</h3>
    <table><thead><tr><th>Categoria</th><th class="num">${MLABEL[resA]}</th><th class="num">${MLABEL[resB]}</th><th class="num">Variação (R$)</th><th class="num">Variação (%)</th><th>Situação</th></tr></thead>
    <tbody>${catKeys.map(k=>rowCmp(k,ca[k]||0,cb[k]||0)).join('')||'<tr><td colspan="6" class="empty">Sem dados nos meses escolhidos.</td></tr>'}
    <tr style="font-weight:700;border-top:2px solid var(--line)"><td>TOTAL</td><td class="num">${brl(ta)}</td><td class="num">${brl(tb)}</td><td class="num ${delta>0?'pos':delta<0?'neg':''}">${(delta>=0?'+':'')+brl(delta)}</td><td class="num">${pctf(pct)}</td><td><span class="tag ${cls}">${sl}</span></td></tr></tbody></table>
  </div>
  <div class="panel"><h3>🏢 Variação por fornecedor</h3>
    <table><thead><tr><th>Fornecedor</th><th class="num">${MLABEL[resA]}</th><th class="num">${MLABEL[resB]}</th><th class="num">Variação (R$)</th><th class="num">Variação (%)</th><th>Situação</th></tr></thead>
    <tbody>${fornKeys.map(k=>rowCmp(k,fa[k]||0,fb[k]||0)).join('')||'<tr><td colspan="6" class="empty">Sem dados nos meses escolhidos.</td></tr>'}</tbody></table>
  </div>`;
  mkChart('c_cmpTot',{type:'bar',data:{labels:[MLABEL[resA],MLABEL[resB]],datasets:[{label:'Custo total',data:[ta,tb],backgroundColor:['#4c6ef5','#7048e8'],borderRadius:10}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>brl(c.parsed.y)}}},scales:{y:{grid:{color:GRID},ticks:{callback:v=>'R$ '+v.toLocaleString('pt-BR')}},x:{grid:{display:false}}}}});
  const topCat=catKeys.slice(0,8);
  mkChart('c_cmpCat',{type:'bar',data:{labels:topCat,datasets:[{label:MLABEL[resA],data:topCat.map(k=>ca[k]||0),backgroundColor:'#4c6ef5',borderRadius:5},{label:MLABEL[resB],data:topCat.map(k=>cb[k]||0),backgroundColor:'#9775fa',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+brl(c.parsed.y)}}},scales:{y:{grid:{color:GRID},ticks:{callback:v=>'R$ '+v.toLocaleString('pt-BR')}},x:{grid:{display:false},ticks:{font:{size:10}}}}}});
}

// ---------- CATEGORIAS (tela) ----------
function catUso(c){
  const k=String(c).trim().toLowerCase();let n=0,t=0;
  MESES.forEach(m=>DB[m].forEach(r=>{if(String(r.categoria||'').trim().toLowerCase()===k){n++;t+=(+r.valor||0);}}));
  return{n,t};
}
function renderCats(){
  const el=document.getElementById('view-categorias');
  el.innerHTML=`
  <div class="page-head"><div><h2>🏷️ Cadastro de Categorias</h2><p>Cadastre as categorias que aparecem como sugestão nos Lançamentos</p></div></div>
  <div class="panel">
    <div class="cat-add no-print">
      <div><label>Nova categoria</label><input id="catNome" placeholder="NOME DA CATEGORIA"></div>
      <div><button class="btn" id="catAddBtn">+ Cadastrar</button></div>
    </div>
    <table><thead><tr><th>Categoria</th><th class="num">Lançamentos</th><th class="num">Total (R$)</th><th class="no-print">Ações</th></tr></thead>
      <tbody id="catBody"></tbody></table>
    <p class="hint" style="margin-top:12px">Só é possível excluir categorias que não estão em uso em nenhum lançamento.</p>
  </div>`;
  const inp=document.getElementById('catNome');
  inp.addEventListener('input',e=>{e.target.value=UP(e.target.value);});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')addCat();});
  document.getElementById('catAddBtn').onclick=addCat;
  drawCats();
}
function drawCats(){
  const tb=document.getElementById('catBody');
  tb.innerHTML=CATS.length?CATS.map((c,i)=>{const u=catUso(c);return `<tr><td>${esc(c)}</td><td class="num">${u.n}</td><td class="num">${brl(u.t)}</td><td class="no-print row-actions"><button class="btn danger" onclick="delCat(${i})">Excluir</button></td></tr>`;}).join(''):'<tr><td colspan="4" class="empty">Nenhuma categoria cadastrada.</td></tr>';
}
function addCat(){
  const inp=document.getElementById('catNome');
  const n=UP(inp.value.trim());
  if(!n){alert('Informe o nome da categoria.');return;}
  if(catExists(n)){alert('Essa categoria já está cadastrada.');return;}
  CATS.push(n);sortCats();saveCats();inp.value='';drawCats();inp.focus();
}
function delCat(i){
  const c=CATS[i];if(c===undefined)return;
  const u=catUso(c);
  if(u.n>0){alert('Não é possível excluir "'+c+'": ela está em uso em '+u.n+' lançamento(s).');return;}
  if(confirm('Excluir a categoria "'+c+'"?')){CATS.splice(i,1);saveCats();drawCats();}
}

// ---------- BACKUP (exportar / importar) ----------
function exportarBackup(){
  const pacote={app:'Composição Analítica de Custos',versao:1,exportadoEm:new Date().toISOString(),dados:DB,categorias:CATS};
  const blob=new Blob([JSON.stringify(pacote,null,2)],{type:'application/json'});
  const d=new Date();const p=n=>String(n).padStart(2,'0');
  const nome='backup-custos-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.json';
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function importarBackup(file){
  if(!file)return;
  const rd=new FileReader();
  rd.onerror=()=>alert('Não foi possível ler o arquivo.');
  rd.onload=()=>{
    let obj;
    try{obj=JSON.parse(rd.result);}catch(e){alert('Arquivo inválido: não é um backup em formato JSON.');return;}
    const dados=(obj&&obj.dados&&typeof obj.dados==='object')?obj.dados:obj;
    if(!dados||typeof dados!=='object'||Array.isArray(dados)||!MESES.some(m=>Array.isArray(dados[m]))){alert('Este arquivo não parece ser um backup deste aplicativo.');return;}
    const novo={};let total=0;
    MESES.forEach(m=>{
      const arr=Array.isArray(dados[m])?dados[m]:[];
      novo[m]=arr.filter(x=>x&&typeof x==='object').map(x=>({fornecedor:String(x.fornecedor||''),categoria:String(x.categoria||''),valor:Math.round((parseFloat(x.valor)||0)*100)/100}));
      total+=novo[m].length;
    });
    if(!confirm('Importar backup com '+total+' lançamento(s)?\n\nIsso SUBSTITUI todos os dados atuais pelos do arquivo.'))return;
    DB=novo;
    if(Array.isArray(obj.categorias)){
      CATS=[];obj.categorias.forEach(c=>{const t=String(c||'').trim();if(t&&!catExists(t))CATS.push(t);});
    }
    syncCatsFromDB();save();
    const ativo=document.querySelector('#nav button.active');
    render(ativo?ativo.dataset.v:'resumo');
    alert('Backup importado com sucesso.');
  };
  rd.readAsText(file);
}
document.getElementById('btnExportar').onclick=exportarBackup;
document.getElementById('btnImportar').onclick=()=>document.getElementById('fileImportar').click();
document.getElementById('fileImportar').addEventListener('change',e=>{importarBackup(e.target.files[0]);e.target.value='';});

// init
renderResumo();

</script>
