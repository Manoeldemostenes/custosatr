<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Composição Analítica de Custos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --blue:#3b5bdb; --blue2:#4c6ef5; --indigo:#4263eb; --purple:#7048e8; --purple2:#9775fa;
  --bg:#0f1021; --bg2:#171a35; --panel:#1d2142; --panel2:#242a52;
  --line:#333a63; --txt:#eef0ff; --mut:#a9b0e0;
  --green:#2fb380; --greenbg:#143a2c; --red:#e85b78; --redbg:#3a1826; --yellow:#e0b64b; --yellowbg:#3a331a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:linear-gradient(135deg,#0f1021,#191b3a 55%,#241a44);color:var(--txt);min-height:100vh}
.app{display:flex;min-height:100vh}
/* SIDEBAR */
.sidebar{width:260px;background:linear-gradient(180deg,#1a1d3d,#241a44);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand .ico{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--blue2),var(--purple));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 18px rgba(112,72,232,.45);flex-shrink:0}
.brand h1{font-size:15px;line-height:1.2;font-weight:700;letter-spacing:.3px}
.brand small{color:var(--mut);font-size:11px}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.nav button{display:flex;align-items:center;gap:12px;background:transparent;border:none;color:var(--mut);padding:12px 14px;border-radius:10px;cursor:pointer;font-size:14px;text-align:left;transition:.18s;width:100%}
.nav button .e{font-size:17px}
.nav button:hover{background:rgba(118,117,250,.12);color:#fff}
.nav button.active{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;box-shadow:0 6px 16px rgba(66,99,235,.4)}
.side-foot{margin-top:auto;font-size:11px;color:var(--mut);padding:12px 8px;border-top:1px solid var(--line);line-height:1.5}
/* MAIN */
.main{flex:1;padding:26px 30px;overflow-x:hidden;min-width:0}
.page-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px}
.page-head h2{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
.page-head p{color:var(--mut);font-size:13px;margin-top:3px}
.head-btns{display:flex;gap:8px;flex-wrap:wrap}
select,input{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:9px;font-size:13px;outline:none}
select:focus,input:focus{border-color:var(--purple2)}
.btn{background:linear-gradient(135deg,var(--blue2),var(--purple));color:#fff;border:none;padding:10px 16px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line)}
.btn.danger{background:var(--redbg);border:1px solid var(--red);color:#ffb3c2;padding:6px 10px;font-weight:500}
.btn.sm{padding:6px 10px;font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:24px}
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative;overflow:hidden}
.card::after{content:'';position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(118,117,250,.25),transparent 70%)}
.card .lab{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.card .val{font-size:24px;font-weight:700;margin-top:8px;overflow-wrap:anywhere}
.card .sub{font-size:12px;color:var(--mut);margin-top:6px}
.panel{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:22px}
.panel h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .sp{flex:1}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:var(--panel)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:hover td{background:rgba(118,117,250,.06)}
tr.editing td{background:rgba(151,117,250,.2)}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.t-eco{background:var(--greenbg);color:#7dffc4;border:1px solid var(--green)}
.t-up{background:var(--redbg);color:#ffb3c2;border:1px solid var(--red)}
.t-eq{background:var(--yellowbg);color:#ffe39a;border:1px solid var(--yellow)}
.pos{color:#ff9db0}.neg{color:#7dffc4}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.chart-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:300px;position:relative}
.chart-box h4{font-size:13px;color:var(--mut);margin-bottom:10px;font-weight:600}
.chart-box canvas{max-height:260px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;margin-bottom:22px}
.vs .mb{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center}
.vs .mb.a{border-color:var(--blue2)}
.vs .mb.b{border-color:var(--purple2)}
.vs .mb .mname{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.vs .mb .mtot{font-size:30px;font-weight:800;margin-top:8px}
.vs .mb .mcount{font-size:12px;color:var(--mut);margin-top:6px}
.vs .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:150px}
.vs .mid .arrow{font-size:30px}
.vs .mid .delta{font-size:20px;font-weight:800}
.vs .mid .pct{font-size:13px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-size:14px}
.hint{font-size:12px;color:var(--mut)}
.row-actions{display:flex;gap:6px;border-bottom:none}
.add-row{display:grid;grid-template-columns:2fr 1.6fr 1fr 1.1fr auto;gap:10px;margin-top:14px;align-items:end}
.add-row label{font-size:11px;color:var(--mut);display:block;margin-bottom:5px}
.add-row input,.add-row select{width:100%}
.add-row .btns{display:flex;gap:8px}
.banner{border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:13px;border:1px solid var(--line);line-height:1.5}
.banner.warn{background:var(--yellowbg);border-color:var(--yellow);color:#ffe39a}
.banner.info{background:rgba(76,110,245,.14);border-color:var(--blue2);color:var(--txt)}
.lista-mud{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13px}
.sug{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.sug:last-child{border-bottom:none}
.resumo-txt{font-size:14px;line-height:1.6;margin-bottom:16px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--panel2);border:1px solid var(--purple2);color:var(--txt);padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:none;align-items:center;gap:14px;z-index:50;font-size:13px;max-width:calc(100vw - 36px)}
.toast.show{display:flex}
.toast button{background:transparent;border:none;color:#b197fc;font-weight:700;cursor:pointer;font-size:13px}
.backup{display:flex;flex-direction:column;gap:8px;padding:14px 2px 6px;border-top:1px solid var(--line);margin-top:10px}
.backup .btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px}
.backup .bt{font-size:10px;color:var(--mut);padding:0 4px;line-height:1.4}
.cat-add{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-bottom:16px}
.cat-add label{font-size:11px;color:var(--mut);display:block;margin-bottom:5px}
.cat-add input{width:100%}
@media(max-width:900px){.backup .bt,.backup .btn .lbl{display:none}.cat-add{grid-template-columns:1fr}}
@media(max-width:900px){.chart-grid{grid-template-columns:1fr}.vs{grid-template-columns:1fr}.sidebar{width:72px}.brand h1,.brand small,.nav button span.lbl,.side-foot{display:none}.nav button{justify-content:center}}
@media(max-width:700px){.add-row{grid-template-columns:1fr}.main{padding:18px 14px}}
@media print{.sidebar,.toolbar,.no-print,.toast{display:none!important}.main{padding:0}body{background:#fff;color:#000}.panel,.card,.chart-box,.vs .mb{background:#fff;border-color:#ccc}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">
    <div class="ico">💰</div>
    <div><h1>COMPOSIÇÃO ANALÍTICA DE CUSTOS</h1><small>Controle &amp; Comparação 2026</small></div>
  </div>
  <nav class="nav" id="nav">
    <button data-v="resumo" class="active"><span class="e">📊</span><span class="lbl">Resumo</span></button>
    <button data-v="lancamentos"><span class="e">🧾</span><span class="lbl">Lançamentos</span></button>
    <button data-v="dashboard"><span class="e">📈</span><span class="lbl">Dashboard</span></button>
    <button data-v="resultado"><span class="e">🔀</span><span class="lbl">Resultado</span></button>
    <button data-v="fornecedores"><span class="e">🏢</span><span class="lbl">Fornecedores</span></button>
    <button data-v="categorias"><span class="e">🏷️</span><span class="lbl">Categorias</span></button>
  </nav>
  <div class="backup no-print">
    <button class="btn" id="btnExportar" title="Exportar Backup"><span>⬇️</span><span class="lbl">Exportar Backup</span></button>
    <button class="btn ghost" id="btnImportar" title="Importar Backup"><span>⬆️</span><span class="lbl">Importar Backup</span></button>
    <input type="file" id="fileImportar" accept=".json,.txt,application/json,text/plain" style="display:none">
    <div class="bt">Baixa/carrega todos os dados em um arquivo .json no seu computador.</div>
  </div>
  <div class="side-foot" id="sideFoot">R$ • pt-BR • dados salvos no navegador</div>
</aside>
<main class="main" id="main">
  <section id="view-resumo" class="view"></section>
  <section id="view-lancamentos" class="view" style="display:none"></section>
  <section id="view-dashboard" class="view" style="display:none"></section>
  <section id="view-resultado" class="view" style="display:none"></section>
  <section id="view-fornecedores" class="view" style="display:none"></section>
  <section id="view-categorias" class="view" style="display:none"></section>
</main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const ANO=2026;
const MESES=['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
const MLABEL={JANEIRO:'Janeiro',FEVEREIRO:'Fevereiro','MARÇO':'Março',ABRIL:'Abril',MAIO:'Maio',JUNHO:'Junho',JULHO:'Julho',AGOSTO:'Agosto',SETEMBRO:'Setembro',OUTUBRO:'Outubro',NOVEMBRO:'Novembro',DEZEMBRO:'Dezembro'};
// Começa vazio: os dados reais ficam apenas no navegador / nos arquivos de backup (nada de valores dentro do código).
const SEED={};MESES.forEach(m=>{SEED[m]=[];});
const KEY='composicao_custos_2026';
const BKPKEY='composicao_custos_2026_ultimo_backup';
let DB;
try{DB=JSON.parse(localStorage.getItem(KEY))||null;}catch(e){DB=null;}
if(!DB||typeof DB!=='object'||Array.isArray(DB)){DB=JSON.parse(JSON.stringify(SEED));}
for(const m of MESES){if(!Array.isArray(DB[m]))DB[m]=[];}
let avisouSave=false;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(DB));}
  catch(e){if(!avisouSave){avisouSave=true;alert('Não foi possível salvar no navegador (armazenamento cheio ou bloqueado). Exporte um backup para não perder os dados.');}}
}

// ---------- CATEGORIAS (cadastro) ----------
const CATKEY='composicao_custos_2026_categorias';
const CATS_PADRAO=['Combustível','Manutenção Frota','Manutenção Equipamento','Manutenção Predial','Manutenção Geral','Aditivo e Lubrificante','Custo Operacional','Energia','Água','Estadia','EPI','Copa/Escritório'];
let CATS;
try{CATS=JSON.parse(localStorage.getItem(CATKEY));}catch(e){CATS=null;}
if(!Array.isArray(CATS))CATS=CATS_PADRAO.slice();
function saveCats(){try{localStorage.setItem(CATKEY,JSON.stringify(CATS));}catch(e){}}
function catExists(n){const k=String(n).trim().toLowerCase();return CATS.some(c=>String(c).trim().toLowerCase()===k);}
function sortCats(){CATS.sort((a,b)=>String(a).localeCompare(String(b),'pt-BR'));}
function syncCatsFromDB(){
  MESES.forEach(m=>DB[m].forEach(r=>{const c=String(r.categoria||'').trim();if(c&&!catExists(c))CATS.push(c);}));
  sortCats();saveCats();
}

// ---------- UTILITÁRIOS ----------
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const limpa=s=>String(s==null?'':s).replace(/\s+/g,' ').trim();
const UP=s=>limpa(s).toUpperCase();          // texto final (sem espaços sobrando, MAIÚSCULO)
const UPL=s=>String(s).toUpperCase();         // enquanto digita (mantém espaços)
const normTxt=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const brl=v=>'R$ '+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brlSinal=v=>(v>0?'+':v<0?'−':'')+brl(Math.abs(v));
const pctf=v=>(v>=0?'+':'')+(v*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const pctNum=v=>(v*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const fmtData=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')?String(d).split('-').reverse().join('/'):'—';
const pctVar=(a,b)=>a===0?(b===0?'—':'NOVO'):pctf((b-a)/a);
function parseValor(s){
  s=String(s==null?'':s).replace(/R\$|\s/g,'');
  if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  if(!/^-?\d+(\.\d+)?$/.test(s))return NaN;
  return parseFloat(s);
}
function upperKeep(t){const s=t.selectionStart,e=t.selectionEnd,v=UPL(t.value);if(v!==t.value){t.value=v;try{t.setSelectionRange(s,e);}catch(_){}}}

// Padroniza fornecedor/categoria (MAIÚSCULO, sem espaços duplicados) para não dividir totais.
function normalizeDB(){
  let mudou=false;
  MESES.forEach(m=>DB[m].forEach(r=>{
    const f=UP(r.fornecedor),c=UP(r.categoria);
    if(f!==r.fornecedor){r.fornecedor=f;mudou=true;}
    if(c!==r.categoria){r.categoria=c;mudou=true;}
  }));
  const novo=[];
  CATS.forEach(c=>{const k=UP(c);if(k&&!novo.includes(k))novo.push(k);});
  novo.sort((a,b)=>a.localeCompare(b,'pt-BR'));
  if(JSON.stringify(novo)!==JSON.stringify(CATS)){CATS=novo;mudou=true;}
  if(mudou){syncCatsFromDB();save();}
}

// ---------- MÊS EM ANDAMENTO ----------
const mesAtualIdx=()=>{const d=new Date();return d.getFullYear()===ANO?d.getMonth():-1;};
const mesTotal=m=>DB[m].reduce((s,r)=>s+(+r.valor||0),0);
const mesesComDados=()=>MESES.filter(m=>DB[m].length>0);
const emAndamento=m=>MESES.indexOf(m)===mesAtualIdx()&&DB[m].length>0;
const mesesFechados=()=>mesesComDados().filter(m=>!emAndamento(m));
function aggBy(m,field){const o={};DB[m].forEach(r=>{const k=r[field]||'(sem)';o[k]=(o[k]||0)+(+r.valor||0);});return o;}
function situ(delta){if(delta<0)return['ECONOMIA','t-eco'];if(delta>0)return['AUMENTO DE CUSTO','t-up'];return['SEM VARIAÇÃO','t-eq'];}
const activeView=()=>{const b=document.querySelector('#nav button.active');return b?b.dataset.v:'resumo';};

// ---------- GRÁFICOS ----------
const PAL=['#4c6ef5','#7048e8','#3b5bdb','#9775fa','#5c7cfa','#845ef7','#4263eb','#b197fc','#364fc7','#6741d9','#748ffc','#9c36b5'];
const GRID='rgba(118,117,250,.12)', TICK='#a9b0e0';
const TEM_CHART=typeof Chart!=='undefined';
if(TEM_CHART){Chart.defaults.color=TICK;Chart.defaults.font.family="'Segoe UI',system-ui,Arial";}
let charts={};
function mkChart(id,cfg){
  const el=document.getElementById(id);
  if(!TEM_CHART){
    if(el){const p=el.parentElement;el.remove();if(p&&!p.querySelector('.sem-chart'))p.insertAdjacentHTML('beforeend','<p class="hint sem-chart">Gráfico indisponível: a biblioteca de gráficos não carregou (verifique a conexão). Os dados continuam nas tabelas.</p>');}
    return;
  }
  if(charts[id]){charts[id].destroy();delete charts[id];}
  if(el)charts[id]=new Chart(el,cfg);
}

// ---------- AVISOS (toast) ----------
let toastTimer=null;
function toast(msg,acaoTxt,acaoFn,ms){
  const t=document.getElementById('toast');
  t.innerHTML='<span></span>';t.firstChild.textContent=msg;
  if(acaoTxt){const b=document.createElement('button');b.textContent=acaoTxt;b.onclick=()=>{t.classList.remove('show');acaoFn();};t.appendChild(b);}
  t.classList.add('show');clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),ms||(acaoTxt?9000:4000));
}

// ---------- NAV ----------
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const v=b.dataset.v;document.querySelectorAll('.view').forEach(s=>s.style.display='none');document.getElementById('view-'+v).style.display='block';render(v);});
function render(v){
  aplicarNFPendente();
  normalizeDB();
  if(v==='resumo')renderResumo();else if(v==='lancamentos')renderLanc();else if(v==='dashboard')renderDash();else if(v==='resultado')renderResult();else if(v==='fornecedores')renderForn();else if(v==='categorias')renderCats();
}

// ---------- BACKUP: lembrete (não altera as funções de backup) ----------
function lerBackupTs(){try{return +localStorage.getItem(BKPKEY)||0;}catch(e){return 0;}}
function atualizaRodape(){
  const t=lerBackupTs();
  document.getElementById('sideFoot').innerHTML='R$ • pt-BR • dados salvos no navegador<br>Último backup: '+(t?new Date(t).toLocaleDateString('pt-BR'):'nunca registrado');
}
function bannerBackup(){
  const n=MESES.reduce((s,m)=>s+DB[m].length,0);if(!n)return '';
  const t=lerBackupTs();const dias=t?Math.floor((Date.now()-t)/86400000):null;
  if(dias!==null&&dias<7)return '';
  return `<div class="banner warn no-print">💾 ${dias===null?'Nenhum backup registrado neste navegador.':'Seu último backup foi há '+dias+' dia(s).'} Clique em <strong>Exportar Backup</strong> na barra lateral para guardar seus dados em um arquivo.</div>`;
}

// ---------- RESUMO ----------
function renderResumo(){
  const comDados=mesesComDados();
  const fech=mesesFechados();
  const baseMeses=fech.length?fech:comDados;
  const base=baseMeses.map(m=>({m,t:mesTotal(m)}));
  const totalAno=comDados.reduce((s,m)=>s+mesTotal(m),0);
  const media=base.length?base.reduce((s,x)=>s+x.t,0)/base.length:0;
  let maior=null,menor=null;
  base.forEach(x=>{if(maior===null||x.t>maior.t)maior=x;if(menor===null||x.t<menor.t)menor=x;});
  if(!maior)maior={m:'-',t:0};if(!menor)menor={m:'-',t:0};
  const parcial=comDados.find(emAndamento);
  const nLanc=comDados.reduce((s,m)=>s+DB[m].length,0);
  const el=document.getElementById('view-resumo');
  el.innerHTML=`
  <div class="page-head"><div><h2>📊 Resumo Geral</h2><p>Visão consolidada dos custos lançados em ${ANO}</p></div></div>
  ${nLanc===0?'<div class="banner info">👋 Ainda não há lançamentos neste navegador. Para trazer seus dados, use <strong>Importar Backup</strong> na barra lateral. Para começar do zero, vá em <strong>Lançamentos</strong>.</div>':''}
  ${bannerBackup()}
  <div class="cards">

function mesPadraoLanc(){const i=mesAtualIdx();if(i>=0)return MESES[i];const cd=mesesComDados();return cd.length?cd[cd.length-1]:'JANEIRO';}

function drawLanc(){
  const tb=document.getElementById('lancBody');if(!tb)return;
  const tot=mesTotal(lancMes);
  let rows=DB[lancMes].map((r,i)=>({r,i}));
  const q=normTxt(lancBusca).trim();
  if(q)rows=rows.filter(x=>normTxt(x.r.fornecedor).includes(q));
  if(lancCat)rows=rows.filter(x=>x.r.categoria===lancCat);
  if(lancOrd==='MAIOR')rows.sort((a,b)=>b.r.valor-a.r.valor);
  else if(lancOrd==='MENOR')rows.sort((a,b)=>a.r.valor-b.r.valor);
  else if(lancOrd==='FORN')rows.sort((a,b)=>String(a.r.fornecedor).localeCompare(String(b.r.fornecedor),'pt-BR'));
  else if(lancOrd==='CAT')rows.sort((a,b)=>String(a.r.categoria).localeCompare(String(b.r.categoria),'pt-BR'));
  tb.innerHTML=rows.length?rows.map(({r,i})=>`<tr${i===editIdx?' class="editing"':''}>
    <td>${esc(r.fornecedor||'')}</td><td>${esc(r.categoria||'')}</td><td>${fmtData(r.dataNF)}</td><td class="num">${brl(r.valor)}</td><td class="num">${tot?pctNum((+r.valor||0)/tot):'0,0%'}</td>
    <td class="no-print"><div class="row-actions"><button class="btn ghost sm" data-act="edit" data-i="${i}">Editar</button><button class="btn danger" data-act="del" data-i="${i}">Excluir</button></div></td></tr>`).join(''):`<tr><td colspan="6" class="empty">${DB[lancMes].length?'Nenhum lançamento corresponde ao filtro.':'Sem lançamentos neste mês. Adicione abaixo.'}</td></tr>`;
  document.getElementById('lancTot').textContent=brl(tot);
  const filtrando=!!(q||lancCat);
  document.getElementById('lancFilt').textContent=filtrando?' • filtrado: '+brl(rows.reduce((s,x)=>s+(+x.r.valor||0),0))+' ('+rows.length+')':'';
}
function salvarLanc(){
  const f=UP(document.getElementById('nf').value);
  const c=UP(document.getElementById('nc').value);
  const v=parseValor(document.getElementById('nv').value);
  const dn=(document.getElementById('nd').value||'').trim();
  if(!f){alert('Informe o fornecedor.');return;}
  if(!c){alert('Informe a categoria.');return;}
  if(isNaN(v)||v===0){alert('Informe um valor válido, diferente de zero. Exemplo: 1.234,56');return;}
  const valor=Math.round(v*100)/100;
  if(!catExists(c)){
    if(!confirm('A categoria "'+c+'" ainda não existe. Deseja criá-la?'))return;
    CATS.push(c);sortCats();saveCats();
  }
  if(editIdx===null){
    const dup=DB[lancMes].some(r=>r.fornecedor===f&&r.categoria===c&&Math.abs((+r.valor||0)-valor)<0.005);
    if(dup&&!confirm('Já existe um lançamento igual neste mês (mesmo fornecedor, categoria e valor). Adicionar mesmo assim?'))return;
    const item={fornecedor:f,categoria:c,valor};if(dn)item.dataNF=dn;
    DB[lancMes].push(item);
    toast('Lançamento adicionado.');
  }else{
    const item={fornecedor:f,categoria:c,valor};if(dn)item.dataNF=dn;
    DB[lancMes][editIdx]=item;
    editIdx=null;toast('Lançamento atualizado.');
  }
  save();renderLanc();
  const nf=document.getElementById('nf');if(nf)nf.focus();
}
function editarLanc(i){if(!DB[lancMes][i])return;editIdx=i;renderLanc();}
function delLanc(i){
  const r=DB[lancMes][i];if(!r)return;
  DB[lancMes].splice(i,1);editIdx=null;save();
  ultimoExcluido={mes:lancMes,i,row:r};
  renderLanc();
  toast('Lançamento excluído.','Desfazer',desfazerExcluir);
}
function desfazerExcluir(){
  const u=ultimoExcluido;if(!u)return;
  DB[u.mes].splice(Math.min(u.i,DB[u.mes].length),0,u.row);
  ultimoExcluido=null;save();render(activeView());toast('Exclusão desfeita.');
}
// CSV (Excel pt-BR: separador ";" e vírgula decimal)
function csvTexto(s){s=String(s==null?'':s);if(/^[=+\-@]/.test(s))s="'"+s;return /[;"\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function exportarCSV(mes){
  const linhas=[['Mês','Fornecedor','Categoria','Valor (R$)']];
  (mes?[mes]:MESES).forEach(m=>DB[m].forEach(r=>linhas.push([csvTexto(MLABEL[m]),csvTexto(r.fornecedor),csvTexto(r.categoria),(+r.valor||0).toFixed(2).replace('.',',')])));
  if(linhas.length===1){alert('Não há lançamentos para exportar.');return;}
  const csv='\ufeff'+linhas.map(l=>l.join(';')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='lancamentos-'+(mes?MLABEL[mes].toLowerCase():'ano')+'-'+ANO+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
(function(){
  const v=document.getElementById('view-lancamentos');
  v.addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');if(!b)return;
    const a=b.dataset.act,i=+b.dataset.i;
    if(a==='salvar')salvarLanc();
    else if(a==='cancelar'){editIdx=null;renderLanc();}
    else if(a==='edit')editarLanc(i);
    else if(a==='del')delLanc(i);
    else if(a==='csvMes')exportarCSV(lancMes);
    else if(a==='csvAno')exportarCSV(null);
  });
  v.addEventListener('input',e=>{
    const t=e.target;
    if(t.id==='nf'||t.id==='nc')upperKeep(t);
    else if(t.id==='lancBusca'){lancBusca=t.value;drawLanc();}
  });
  v.addEventListener('change',e=>{
    const t=e.target;
    if(t.id==='lancSel'){lancMes=t.value;lancCat='';editIdx=null;renderLanc();}
    else if(t.id==='lancCatSel'){lancCat=t.value;drawLanc();}
    else if(t.id==='lancOrd'){lancOrd=t.value;drawLanc();}
  });
  v.addEventListener('keydown',e=>{if(e.key==='Enter'&&['nf','nc','nv','nd'].includes(e.target.id)){e.preventDefault();salvarLanc();}});
})();

// ---------- RESULTADO (comparação de 2 meses escolhidos) ----------
function padraoResultado(){
  let l=mesesFechados();if(l.length<2)l=mesesComDados();
  if(l.length>=2)return[l[l.length-2],l[l.length-1]];
  if(l.length===1)return[l[0],l[0]];
  return['JANEIRO','FEVEREIRO'];
}
let [resA,resB]=padraoResultado();
function renderResult(){
  const el=document.getElementById('view-resultado');
  const opts=m=>MESES.map(x=>`<option value="${x}" ${x===m?'selected':''}>${MLABEL[x]}${DB[x].length?' • '+DB[x].length:' (vazio)'}${emAndamento(x)?' — em andamento':''}</option>`).join('');
  el.innerHTML=`
  <div class="page-head"><div><h2>🔀 Resultado — Comparação de Custos</h2><p>Escolha dois meses para comparar lado a lado</p></div>
    <div class="no-print"><button class="btn ghost" onclick="window.print()">🖨️ Imprimir</button></div></div>
  <div class="panel no-print"><div class="toolbar" style="margin:0">
    <label class="hint">Mês A:</label><select id="selA">${opts(resA)}</select>
    <span style="font-weight:700;color:var(--purple2)">VS</span>
    <label class="hint">Mês B:</label><select id="selB">${opts(resB)}</select>
    <span class="sp"></span><button class="btn" id="swap">⇄ Inverter</button>
  </div></div>
  <div id="resOut"></div>`;
  document.getElementById('selA').onchange=e=>{resA=e.target.value;drawResult();};
  document.getElementById('selB').onchange=e=>{resB=e.target.value;drawResult();};
  document.getElementById('swap').onclick=()=>{[resA,resB]=[resB,resA];renderResult();};
  drawResult();
}
function drawResult(){
  const out=document.getElementById('resOut');
  const ta=mesTotal(resA),tb=mesTotal(resB);
  const delta=tb-ta;
  const[sl,cls]=situ(delta);
  const arrow=delta<0?'🟢▼':delta>0?'🔴▲':'🟡=';
  const dcls=delta>0?'pos':delta<0?'neg':'';
  const ca=aggBy(resA,'categoria'),cb=aggBy(resB,'categoria');
  const catKeys=[...new Set([...Object.keys(ca),...Object.keys(cb)])].sort((k1,k2)=>((cb[k2]||0)+(ca[k2]||0))-((cb[k1]||0)+(ca[k1]||0)));
  const fa=aggBy(resA,'fornecedor'),fb=aggBy(resB,'fornecedor');
  const fornKeys=[...new Set([...Object.keys(fa),...Object.keys(fb)])].sort((k1,k2)=>((fb[k2]||0)+(fa[k2]||0))-((fb[k1]||0)+(fa[k1]||0)));
  const rowCmp=(k,a,b)=>{const d=b-a;const[s,c]=situ(d);return `<tr><td>${esc(k)}</td><td class="num">${brl(a)}</td><td class="num">${brl(b)}</td><td class="num ${d>0?'pos':d<0?'neg':''}">${brlSinal(d)}</td><td class="num">${pctVar(a,b)}</td><td><span class="tag ${c}">${s}</span></td></tr>`;};
  // "O que mudou": maiores altas e quedas por categoria
  const mc=catKeys.map(k=>({k,a:ca[k]||0,b:cb[k]||0,d:(cb[k]||0)-(ca[k]||0)}));
  const altas=mc.filter(x=>x.d>0).sort((x,y)=>y.d-x.d).slice(0,3);
  const quedas=mc.filter(x=>x.d<0).sort((x,y)=>x.d-y.d).slice(0,3);
  const li=x=>`<li><strong>${esc(x.k)}</strong> <span class="${x.d>0?'pos':'neg'}">${brlSinal(x.d)}</span> <span class="hint">(${pctVar(x.a,x.b)})</span></li>`;
  const resumoTxt=(ta===0&&tb===0)?'Sem lançamentos nos meses escolhidos.':
    `O custo total ${delta>0?'subiu':delta<0?'caiu':'ficou igual'}${delta!==0?' <strong class="'+dcls+'">'+brl(Math.abs(delta))+'</strong> ('+pctVar(ta,tb)+')':''} de ${MLABEL[resA]} para ${MLABEL[resB]}.`+
    (altas[0]?` A maior alta foi em <strong>${esc(altas[0].k)}</strong> (${brlSinal(altas[0].d)}).`:'')+
    (quedas[0]?` A maior queda foi em <strong>${esc(quedas[0].k)}</strong> (${brlSinal(quedas[0].d)}).`:'');
  const avisoParcial=[resA,resB].filter((m,i,a)=>emAndamento(m)&&a.indexOf(m)===i);
  out.innerHTML=`
  ${avisoParcial.length?`<div class="banner warn no-print">⚠️ ${avisoParcial.map(m=>MLABEL[m]).join(' e ')} ${avisoParcial.length>1?'estão':'está'} em andamento: os valores são parciais, então a comparação tende a mostrar queda ou aumento que ainda não é definitivo.</div>`:''}
  <div class="vs">
    <div class="mb a"><div class="mname">${MLABEL[resA]}</div><div class="mtot">${brl(ta)}</div><div class="mcount">${DB[resA].length} lançamento(s)</div></div>
    <div class="mid"><div class="arrow">${arrow}</div><div class="delta ${dcls}">${brlSinal(delta)}</div><div class="pct">${pctVar(ta,tb)}</div><span class="tag ${cls}">${sl}</span></div>
    <div class="mb b"><div class="mname">${MLABEL[resB]}</div><div class="mtot">${brl(tb)}</div><div class="mcount">${DB[resB].length} lançamento(s)</div></div>
  </div>
  <div class="panel"><h3>💡 O que mudou</h3>
    <p class="resumo-txt">${resumoTxt}</p>
    <div class="chart-grid">
      <div><h4 class="hint" style="margin-bottom:8px">🔺 Maiores altas (categorias)</h4>${altas.length?`<ul class="lista-mud">${altas.map(li).join('')}</ul>`:'<p class="hint">Nenhuma categoria subiu.</p>'}</div>
      <div><h4 class="hint" style="margin-bottom:8px">🔻 Maiores quedas (categorias)</h4>${quedas.length?`<ul class="lista-mud">${quedas.map(li).join('')}</ul>`:'<p class="hint">Nenhuma categoria caiu.</p>'}</div>
    </div>
  </div>
  <div class="chart-grid">
    <div class="chart-box"><h4>Total: ${MLABEL[resA]} vs ${MLABEL[resB]}</h4><canvas id="c_cmpTot"></canvas></div>
    <div class="chart-box"><h4>Comparação por categoria</h4><canvas id="c_cmpCat"></canvas></div>
  </div>
  <div class="panel" style="margin-top:22px"><h3>📂 Variação por categoria</h3>
    <div class="tscroll"><table><thead><tr><th>Categoria</th><th class="num">${MLABEL[resA]}</th><th class="num">${MLABEL[resB]}</th><th class="num">Variação (R$)</th><th class="num">Variação (%)</th><th>Situação</th></tr></thead>
    <tbody>${catKeys.map(k=>rowCmp(k,ca[k]||0,cb[k]||0)).join('')||'<tr><td colspan="6" class="empty">Sem dados nos meses escolhidos.</td></tr>'}
    <tr style="font-weight:700;border-top:2px solid var(--line)"><td>TOTAL</td><td class="num">${brl(ta)}</td><td class="num">${brl(tb)}</td><td class="num ${dcls}">${brlSinal(delta)}</td><td class="num">${pctVar(ta,tb)}</td><td><span class="tag ${cls}">${sl}</span></td></tr></tbody></table></div>
  </div>
  <div class="panel"><h3>🏢 Variação por fornecedor</h3>
    <div class="tscroll"><table><thead><tr><th>Fornecedor</th><th class="num">${MLABEL[resA]}</th><th class="num">${MLABEL[resB]}</th><th class="num">Variação (R$)</th><th class="num">Variação (%)</th><th>Situação</th></tr></thead>
    <tbody>${fornKeys.map(k=>rowCmp(k,fa[k]||0,fb[k]||0)).join('')||'<tr><td colspan="6" class="empty">Sem dados nos meses escolhidos.</td></tr>'}</tbody></table></div>
  </div>`;
  mkChart('c_cmpTot',{type:'bar',data:{labels:[MLABEL[resA],MLABEL[resB]],datasets:[{label:'Custo total',data:[ta,tb],backgroundColor:['#4c6ef5','#7048e8'],borderRadius:10}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>brl(c.parsed.y)}}},scales:{y:{grid:{color:GRID},ticks:{callback:v=>'R$ '+v.toLocaleString('pt-BR')}},x:{grid:{display:false}}}}});
  const topCat=catKeys.slice(0,8);
  mkChart('c_cmpCat',{type:'bar',data:{labels:topCat,datasets:[{label:MLABEL[resA],data:topCat.map(k=>ca[k]||0),backgroundColor:'#4c6ef5',borderRadius:5},{label:MLABEL[resB],data:topCat.map(k=>cb[k]||0),backgroundColor:'#9775fa',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+brl(c.parsed.y)}}},scales:{y:{grid:{color:GRID},ticks:{callback:v=>'R$ '+v.toLocaleString('pt-BR')}},x:{grid:{display:false},ticks:{font:{size:10}}}}}});
}

// ---------- FORNECEDORES (renomear / mesclar nomes parecidos) ----------
let fornBusca='';
function fornecedoresResumo(){
  const o={};
  MESES.forEach(m=>DB[m].forEach(r=>{const k=r.fornecedor||'';if(!o[k])o[k]={n:0,t:0};o[k].n++;o[k].t+=(+r.valor||0);}));
  return o;
}
const chaveForn=s=>normTxt(s).replace(/[^a-z0-9]/g,'');
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
function sugestoesForn(map){
  const nomes=Object.keys(map).filter(Boolean);const out=[];
  for(let i=0;i<nomes.length;i++)for(let j=i+1;j<nomes.length;j++){
    const a=chaveForn(nomes[i]),b=chaveForn(nomes[j]);if(!a||!b)continue;
    if(a===b||(Math.min(a.length,b.length)>=6&&lev(a,b)<=2)){
      const A=map[nomes[i]],B=map[nomes[j]];
      const destino=(A.n>B.n||(A.n===B.n&&A.t>=B.t))?nomes[i]:nomes[j];
      out.push({de:destino===nomes[i]?nomes[j]:nomes[i],para:destino});
    }
  }
  return out.slice(0,10);
}
function renderForn(){
  const el=document.getElementById('view-fornecedores');
  el.innerHTML=`
  <div class="page-head"><div><h2>🏢 Fornecedores</h2><p>Renomeie ou mescle nomes parecidos para que os totais não fiquem divididos</p></div></div>
  <div id="fornSug"></div>
  <div class="panel">
    <div class="toolbar no-print"><input id="fornBusca" placeholder="🔎 Buscar fornecedor" value="${esc(fornBusca)}" style="min-width:230px"><span class="sp"></span><span class="hint" id="fornCount"></span></div>
    <div class="tscroll"><table><thead><tr><th>Fornecedor</th><th class="num">Lançamentos</th><th class="num">Total (R$)</th><th class="no-print">Ações</th></tr></thead><tbody id="fornBody"></tbody></table></div>
  </div>`;
  drawForn();
}
function drawForn(){
  const map=fornecedoresResumo();
  const q=normTxt(fornBusca).trim();
  const arr=Object.entries(map).sort((a,b)=>b[1].t-a[1].t).filter(([k])=>!q||normTxt(k).includes(q));
  const sug=sugestoesForn(map);
  document.getElementById('fornSug').innerHTML=sug.length?`<div class="banner warn no-print"><strong>Possíveis nomes duplicados</strong> — confira e mescle se forem o mesmo fornecedor:
    ${sug.map(s=>`<div class="sug"><span>${esc(s.de)} <span class="hint">≈</span> ${esc(s.para)}</span><button class="btn sm" data-act="merge" data-de="${esc(s.de)}" data-para="${esc(s.para)}">Mesclar em “${esc(s.para)}”</button></div>`).join('')}</div>`:'';
  document.getElementById('fornBody').innerHTML=arr.length?arr.map(([k,v])=>`<tr><td>${k?esc(k):'<span class="hint">(sem nome)</span>'}</td><td class="num">${v.n}</td><td class="num">${brl(v.t)}</td><td class="no-print"><button class="btn ghost sm" data-act="ren" data-de="${esc(k)}">Renomear / mesclar</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">Nenhum fornecedor encontrado.</td></tr>';
  document.getElementById('fornCount').textContent=arr.length+' fornecedor(es)';
}
function aplicarRenomeFornecedor(de,para){
  let n=0;
  MESES.forEach(m=>DB[m].forEach(r=>{if((r.fornecedor||'')===de){r.fornecedor=para;n++;}}));
  save();return n;
}
function renomearForn(de){
  const novo=UP(prompt('Novo nome para "'+(de||'(sem nome)')+'":\n(Se já existir um fornecedor com esse nome, os lançamentos serão mesclados.)',de)||'');
  if(!novo||novo===de)return;
  if(fornecedoresLista().includes(novo)&&!confirm('Já existe o fornecedor "'+novo+'". Mesclar os lançamentos de "'+de+'" nele?'))return;
  const n=aplicarRenomeFornecedor(de,novo);
  drawForn();toast(n+' lançamento(s) atualizado(s).');
}
function mesclarForn(de,para){
  if(!confirm('Mesclar "'+de+'" em "'+para+'"? Todos os lançamentos passarão a usar "'+para+'".'))return;
  const n=aplicarRenomeFornecedor(de,para);
  drawForn();toast(n+' lançamento(s) atualizado(s).');
}
(function(){
  const v=document.getElementById('view-fornecedores');
  v.addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');if(!b)return;
    if(b.dataset.act==='ren')renomearForn(b.dataset.de);
    else if(b.dataset.act==='merge')mesclarForn(b.dataset.de,b.dataset.para);
  });
  v.addEventListener('input',e=>{if(e.target.id==='fornBusca'){fornBusca=e.target.value;drawForn();}});
})();

// ---------- CATEGORIAS (tela) ----------
function catUso(c){
  const k=String(c).trim().toLowerCase();let n=0,t=0;
  MESES.forEach(m=>DB[m].forEach(r=>{if(String(r.categoria||'').trim().toLowerCase()===k){n++;t+=(+r.valor||0);}}));
  return{n,t};
}
function renderCats(){
  const el=document.getElementById('view-categorias');
  el.innerHTML=`
  <div class="page-head"><div><h2>🏷️ Cadastro de Categorias</h2><p>Cadastre as categorias que aparecem como sugestão nos Lançamentos</p></div></div>
  <div class="panel">
    <div class="cat-add no-print">
      <div><label>Nova categoria</label><input id="catNome" placeholder="NOME DA CATEGORIA"></div>
      <div><button class="btn" id="catAddBtn">+ Cadastrar</button></div>
    </div>
    <div class="tscroll"><table><thead><tr><th>Categoria</th><th class="num">Lançamentos</th><th class="num">Total (R$)</th><th class="no-print">Ações</th></tr></thead>
      <tbody id="catBody"></tbody></table></div>
    <p class="hint" style="margin-top:12px">Só é possível excluir categorias que não estão em uso em nenhum lançamento. Use “Editar” para corrigir o nome (se o novo nome já existir, os lançamentos são mesclados).</p>
  </div>`;
  const inp=document.getElementById('catNome');
  inp.addEventListener('input',e=>{upperKeep(e.target);});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')addCat();});
  document.getElementById('catAddBtn').onclick=addCat;
  document.getElementById('catBody').addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');if(!b)return;
    if(b.dataset.act==='del')delCat(+b.dataset.i);else if(b.dataset.act==='ren')renomearCat(+b.dataset.i);
  });
  drawCats();
}
function drawCats(){
  const tb=document.getElementById('catBody');
  tb.innerHTML=CATS.length?CATS.map((c,i)=>{const u=catUso(c);return `<tr><td>${esc(c)}</td><td class="num">${u.n}</td><td class="num">${brl(u.t)}</td><td class="no-print"><div class="row-actions"><button class="btn ghost sm" data-act="ren" data-i="${i}">Editar</button><button class="btn danger" data-act="del" data-i="${i}">Excluir</button></div></td></tr>`;}).join(''):'<tr><td colspan="4" class="empty">Nenhuma categoria cadastrada.</td></tr>';
}
function addCat(){
  const inp=document.getElementById('catNome');
  const n=UP(inp.value);
  if(!n){alert('Informe o nome da categoria.');return;}
  if(catExists(n)){alert('Essa categoria já está cadastrada.');return;}
  CATS.push(n);sortCats();saveCats();inp.value='';drawCats();inp.focus();
}
function delCat(i){
  const c=CATS[i];if(c===undefined)return;
  const u=catUso(c);
  if(u.n>0){alert('Não é possível excluir "'+c+'": ela está em uso em '+u.n+' lançamento(s).');return;}
  if(confirm('Excluir a categoria "'+c+'"?')){CATS.splice(i,1);saveCats();drawCats();}
}
function renomearCat(i){
  const de=CATS[i];if(de===undefined)return;
  const novo=UP(prompt('Novo nome para a categoria "'+de+'":\n(Se já existir, os lançamentos serão mesclados nela.)',de)||'');
  if(!novo||novo===de)return;
  const existe=catExists(novo);
  if(existe&&!confirm('A categoria "'+novo+'" já existe. Mesclar "'+de+'" nela?'))return;
  let n=0;
  MESES.forEach(m=>DB[m].forEach(r=>{if(UP(r.categoria)===de){r.categoria=novo;n++;}}));
  CATS.splice(i,1);if(!existe)CATS.push(novo);
  sortCats();save();saveCats();drawCats();toast(n+' lançamento(s) atualizado(s).');
}

// ---------- DATA DA NF + BACKUP ----------
// As funções de backup (abaixo) não foram alteradas. O backup exporta a Data da NF (ela faz parte dos dados),
// mas a importação original só reconstrói fornecedor/categoria/valor. Este ouvinte extra lê o mesmo arquivo
// e devolve a Data da NF aos lançamentos depois que a importação é confirmada.
let nfPendente=null,dbVisto=DB;
function aplicarNFPendente(){
  if(!nfPendente||DB===dbVisto)return false;
  const p=nfPendente;
  if(!MESES.every(m=>DB[m].length===p[m].length))return false;
  MESES.forEach(m=>DB[m].forEach((r,i)=>{if(p[m][i])r.dataNF=p[m][i];}));
  nfPendente=null;dbVisto=DB;save();return true;
}
document.getElementById('fileImportar').addEventListener('change',e=>{
  nfPendente=null;
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const obj=JSON.parse(rd.result);
      const dados=(obj&&obj.dados&&typeof obj.dados==='object')?obj.dados:obj;
      const p={};let achou=false;
      MESES.forEach(m=>{
        const arr=Array.isArray(dados[m])?dados[m]:[];
        p[m]=arr.filter(x=>x&&typeof x==='object').map(x=>{const d=/^\d{4}-\d{2}-\d{2}$/.test(x.dataNF||'')?x.dataNF:'';if(d)achou=true;return d;});
      });
      if(!achou)return;
      nfPendente=p;
      if(aplicarNFPendente())render(activeView());
    }catch(err){}
  };
  rd.readAsText(f);
});

// ---------- BACKUP (exportar / importar) ----------
function exportarBackup(){
  const pacote={app:'Composição Analítica de Custos',versao:1,exportadoEm:new Date().toISOString(),dados:DB,categorias:CATS};
  const blob=new Blob([JSON.stringify(pacote,null,2)],{type:'application/json'});
  const d=new Date();const p=n=>String(n).padStart(2,'0');
  const nome='backup-custos-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.json';
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function importarBackup(file){
  if(!file)return;
  const rd=new FileReader();
  rd.onerror=()=>alert('Não foi possível ler o arquivo.');
  rd.onload=()=>{
    let obj;
    try{obj=JSON.parse(rd.result);}catch(e){alert('Arquivo inválido: não é um backup em formato JSON.');return;}
    const dados=(obj&&obj.dados&&typeof obj.dados==='object')?obj.dados:obj;
    if(!dados||typeof dados!=='object'||Array.isArray(dados)||!MESES.some(m=>Array.isArray(dados[m]))){alert('Este arquivo não parece ser um backup deste aplicativo.');return;}
    const novo={};let total=0;
    MESES.forEach(m=>{
      const arr=Array.isArray(dados[m])?dados[m]:[];
      novo[m]=arr.filter(x=>x&&typeof x==='object').map(x=>({fornecedor:String(x.fornecedor||''),categoria:String(x.categoria||''),valor:Math.round((parseFloat(x.valor)||0)*100)/100}));
      total+=novo[m].length;
    });
    if(!confirm('Importar backup com '+total+' lançamento(s)?\n\nIsso SUBSTITUI todos os dados atuais pelos do arquivo.'))return;
    DB=novo;
    if(Array.isArray(obj.categorias)){
      CATS=[];obj.categorias.forEach(c=>{const t=String(c||'').trim();if(t&&!catExists(t))CATS.push(t);});
    }
    syncCatsFromDB();save();
    const ativo=document.querySelector('#nav button.active');
    render(ativo?ativo.dataset.v:'resumo');
    alert('Backup importado com sucesso.');
  };
  rd.readAsText(file);
}
document.getElementById('btnExportar').onclick=exportarBackup;
document.getElementById('btnImportar').onclick=()=>document.getElementById('fileImportar').click();
document.getElementById('fileImportar').addEventListener('change',e=>{importarBackup(e.target.files[0]);e.target.value='';});
// Registra a data do último backup (apenas um ouvinte extra; a função de backup acima não foi alterada)
document.getElementById('btnExportar').addEventListener('click',()=>{
  try{localStorage.setItem(BKPKEY,String(Date.now()));}catch(e){}
  atualizaRodape();
  if(activeView()==='resumo')renderResumo();
});

// init
normalizeDB();
syncCatsFromDB();
atualizaRodape();
renderResumo();
</script>
